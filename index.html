<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X</title>


<style>
body {margin:0;font-family:Arial;color:white;overflow-x:hidden;}

video.bg {position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;}
.overlay {position:fixed;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:-1;}

.container {max-width:900px;width:95%;margin:auto;padding:20px;}

.question {background:rgba(0,0,0,0.5);padding:12px;margin-bottom:12px;border-radius:10px;}

.correct {background:#16a34a !important;}
.wrong {background:#dc2626 !important;}

button {
  padding:14px;
  width:100%;
  background:linear-gradient(135deg,#3b82f6,#9333ea);
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}
button:hover {transform:scale(1.03);}

.music-container {position:fixed;top:15px;right:15px;display:flex;align-items:center;}
.music-btn {background:#111;padding:10px;border-radius:50%;cursor:pointer;}

#volume {width:0;opacity:0;margin-left:10px;transition:0.3s;}
.music-container:hover #volume {width:100px;opacity:1;}

.popup {
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  display:none;justify-content:center;align-items:center;
}
.footer {text-align:center;padding:10px;font-size:16px;color:#0ff;text-shadow:0 0 5px #0ff,0 0 10px #0ff;}

.popup-content {
  position:relative;
  background:#1e293b;
  padding:30px;
  border-radius:15px;
  text-align:center;
}

.close-btn {
  position:absolute;
  top:10px;
  right:15px;
  cursor:pointer;
  font-size:20px;
}

h1 {
  text-align: center;
  margin-top: 10px;
}

@media(max-width:600px){
h1{text-align:center;font-size:20px;}
}


label {
  display:block;
  background: rgba(255,255,255,0.05);
  padding:10px;
  border-radius:10px;
  margin:6px 0;
  cursor:pointer;
  transition:0.3s;
}

label:hover {
  background: rgba(0,255,255,0.1);
}


input[type="radio"] {
  display:none;
}


label span::before {
  content:"";
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid #aaa;
  border-radius:50%;
  margin-right:10px;
  vertical-align:middle;
  transition:0.3s;
}


input[type="radio"]:checked + span {
  color:#0ff;
  font-weight:bold;
}


input[type="radio"]:checked + span::before {
  background:#0ff;
  border-color:#0ff;
  box-shadow:0 0 10px #0ff, 0 0 20px #0ff;
}


input[type="radio"]:checked + span {
  text-shadow:0 0 5px #0ff;
}
</style>
</head>

<body>

<video class="bg" autoplay muted loop playsinline>
  <source src="https://c.top4top.io/m_3745v8l4o1.mp4">
</video>
<div class="overlay"></div>

<div class="music-container">
  <div class="music-btn">🔊</div>
  <input type="range" id="volume" min="0" max="1" step="0.01" value="0.2">
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="">
</audio>
  <!-- https://j.top4top.io/m_3748lc2rv1.mp3 -->

<div class="container">
<h1>Embedded Systems</h1>
<h2>50 MCQs</h2>
<form id="quiz"></form>

<button onclick="submitQuiz()">Submit</button>
<button onclick="restartQuiz()">Restart 🔄</button>
<a href="tf.html">
  <button type="button">⬅ True OR False</button>
</a>
<div class="footer">⚡ Powered by xsaif</div>

</div>

<!-- popup -->
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close-btn" onclick="closePopup()">❌</span>
    <h2 id="finalScore"></h2>
    <button onclick="restartQuiz()">Retry 🔄</button>
  </div>
</div>

<script>

const questions = [
  ["What is the main microcontroller used in Arduino Uno?","ESP32","ATmega328P","PIC16F877A","STM32"],
  ["Which function runs once when the Arduino starts?","loop()","begin()","setup()","start()"],
  ["Which function runs continuously in Arduino?","loop()","setup()","main()","repeat()"],
  ["What is used to upload code to Arduino?","Arduino IDE","Photoshop","MPLAB","Proteus only"],
  ["Which command is used to send data to Serial Monitor?","Serial.begin()","Serial.print()","pinMode()","digitalRead()"],
  ["Which baud rate is commonly used?","9600","100","300","50000"],
  ["Which pin type is used for digital signals?","Analog pin","PWM pin","Digital pin","Power pin"],
  ["Which command sets a pin as OUTPUT?","digitalWrite()","pinMode(pin, OUTPUT)","analogRead()","Serial.begin()"],
  ["What voltage does Arduino Uno operate on?","3V","5V","12V","24V"],
  ["Which symbol is used for comments in one line?","//","##","/* */","**"],
  ["Which function reads a digital pin?","analogRead()","digitalRead()","digitalWrite()","pinMode()"],
  ["Which function writes HIGH or LOW to a pin?","analogRead()","digitalWrite()","Serial.print()","delay()"],
  ["What does HIGH mean in Arduino?","0V","1V","5V","12V"],
  ["What does LOW mean in Arduino?","0V","5V","9V","12V"],
  ["Which function pauses the program?","stop()","delay()","wait()","pause()"],
  ["Which operator is used for assignment?","==","=","!="," >="],
  ["Which statement is used for decision making?","for","while","if","delay"],
  ["Which loop repeats a known number of times?","if","while","for","switch"],
  ["Which pin provides 5V output?","GND","VIN","5V","A0"],
  ["Which pin is ground?","GND","VCC","TX","RX"],
  ["digitalRead() returns:","HIGH or LOW","Voltage only","Frequency","PWM"],
  ["digitalWrite(pin, HIGH) will:","Turn pin OFF","Output 5V","Read analog value","Reset Arduino"],
  ["Which mode is used for button input?","OUTPUT","INPUT","ANALOG","PWM"],
  ["INPUT_PULLUP enables:","External resistor","Internal pull-up resistor","PWM mode","Analog mode"],
  ["In active low button logic, pressing button gives:","HIGH","LOW","PWM","Analog value"],

  ["In active high button logic, pressing button gives:","HIGH","LOW","Floating","PWM"],
  ["Which command configures internal pull-up?","pinMode(pin, INPUT_PULLUP)","digitalWrite(pin, HIGH)","analogRead(pin)","Serial.begin()"],
  ["A floating pin means:","Stable HIGH","Stable LOW","Undefined state","Burned pin"],
  ["Which resistor value is commonly used with buttons?","1Ω","10kΩ","1MΩ","100Ω"],
  ["Pull-down resistors are used to:","Keep pin LOW when button not pressed","Increase voltage","Generate PWM","Burn current"],
  ["Pull-up resistors are used to:","Keep pin HIGH when idle","Generate analog signals","Read motors","Increase PWM"],
  ["Which command checks button state?","digitalRead(buttonPin)","digitalWrite(buttonPin)","analogWrite(buttonPin)","pinMode(buttonPin)"],
  ["What is button debounce?","Motor control","Noise due to rapid switching","Analog reading","PWM generation"],
  ["Which function can help debounce?","delay()","Serial.begin()","tone()","attachInterrupt()"],
  ["HIGH equals binary:","0","1","10","11"],
  ["LOW equals binary:","0","1","5","10"],
  ["Which command turns LED ON?","digitalWrite(led, HIGH)","digitalWrite(led, LOW)","digitalRead(led)","analogRead(led)"],
  ["Which command turns LED OFF?","digitalWrite(led, HIGH)","pinMode(led, INPUT)","digitalWrite(led, LOW)","analogWrite(led, 255)"],
  ["INPUT_PULLUP makes default state:","LOW","HIGH","PWM","Analog"],
  ["What happens if no resistor is used?","Stable reading","Floating input","More memory","Better PWM"],
  ["L298 is used for:","Display control","Motor driving","Audio generation","WiFi communication"],
  ["L298 can control:","Only one motor","Two DC motors","Three motors","Servo only"],
  ["Which component protects Arduino from motor current?","LED","Resistor","Motor driver","Capacitor"],
  ["Which pins control direction in L298?","ENA and ENB","IN1 and IN2","TX and RX","SDA and SCL"],
  ["Which pin controls motor speed?","GND","ENA","IN1","OUT1"],
  ["PWM is used for:","Voltage regulation","Motor speed control","Serial communication","Analog reading"],
  ["analogWrite() produces:","Analog voltage","PWM signal","AC current","Sound"],
  ["PWM values range from:","0-100","0-255","0-1023","1-5"],
  ["analogWrite(pin, 255) means:","OFF","Half speed","Full speed","Reverse"],
  ["analogWrite(pin, 0) means:","Full speed","Reverse","Stop","Brake"]
];

const answers = [
  "ATmega328P",
  "setup()",
  "loop()",
  "Arduino IDE",
  "Serial.print()",
  "9600",
  "Digital pin",
  "pinMode(pin, OUTPUT)",
  "5V",
  "//",
  "digitalRead()",
  "digitalWrite()",
  "5V",
  "0V",
  "delay()",
  "=",
  "if",
  "for",
  "5V",
  "GND",
  "HIGH or LOW",
  "Output 5V",
  "INPUT",
  "Internal pull-up resistor",
  "LOW",
  "HIGH",
  "pinMode(pin, INPUT_PULLUP)",
  "Undefined state",
  "10kΩ",
  "Keep pin LOW when button not pressed",
  "Keep pin HIGH when idle",
  "digitalRead(buttonPin)",
  "Noise due to rapid switching",
  "delay()",
  "1",
  "0",
  "digitalWrite(led, HIGH)",
  "digitalWrite(led, LOW)",
  "HIGH",
  "Floating input",
  "Motor driving",
  "Two DC motors",
  "Motor driver",
  "IN1 and IN2",
  "ENA",
  "Motor speed control",
  "PWM signal",
  "0-255",
  "Full speed",
  "Stop"
];
  
// build questions
window.onload=()=>{
let form=document.getElementById("quiz");

questions.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question";
div.id="q"+(i+1);

let html=`<p>${i+1}. ${q[0]}</p>`;

["A","B","C","D"].forEach((l,j)=>{
html+=`
<label>
  <input type="radio" name="q${i+1}" value="${q[j+1]}">
  <span>${l}) ${q[j+1]}</span>
</label>
`;
});

div.innerHTML=html;
form.appendChild(div);
});
};

// submit
function submitQuiz(){
let score=0;

for(let i=1;i<=questions.length;i++){
let selected=document.querySelector(`input[name="q${i}"]:checked`);
let div=document.getElementById("q"+i);
let correct=answers[i-1];

let labels=div.querySelectorAll("label");

labels.forEach(label => {
  let input = label.querySelector("input");

  if(input.value === correct){
    label.innerHTML += " ✅";
    label.style.color = "#22c55e";
  }
});

if(selected && selected.value===correct){
score++;
div.classList.add("correct");
}else{
div.classList.add("wrong");
}
}

document.getElementById("popup").style.display="flex";
document.getElementById("finalScore").innerHTML=
`🔥 Score: ${score} / ${questions.length}`;
}

// restart
function restartQuiz(){
location.reload();
}

// close popup
function closePopup(){
document.getElementById("popup").style.display="none";
}

let music = document.getElementById("bgMusic");
let volume = document.getElementById("volume");

music.volume = volume.value; 
document.addEventListener("click",()=>{music.play().catch(()=>{});},{once:true});
document.querySelector(".music-btn").onclick=()=>{music.paused?music.play():music.pause()};
volume.oninput=()=>{music.volume=volume.value};
</script>

</body>
</html>
